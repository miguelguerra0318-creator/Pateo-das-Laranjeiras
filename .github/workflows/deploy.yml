name: Páteo Content Studio — deploy (Hosting + regras)

# ─────────────────────────────────────────────────────────────────────────
# Publica o site (Firebase Hosting) e as regras do Firestore.
#
# Corre de duas formas:
#   • AUTOMÁTICO — a cada push no `main` (ex.: ao fundir um PR), publica
#     hosting + regras. É o caminho normal: o que entra no main fica no ar.
#   • MANUAL — no separador Actions ("Run workflow"), podendo escolher o
#     que publicar (só hosting, só regras, ou ambos).
#
# Usa o secret FIREBASE_SERVICE_ACCOUNT (o mesmo do queue.js/sync). Para o
# deploy funcionar, a conta de serviço precisa de TRÊS permissões (uma vez),
# na consola Google Cloud → IAM, para o email client_email do secret:
#   • Firebase Hosting Admin      (roles/firebasehosting.admin)
#   • Firebase Rules Admin        (roles/firebaserules.admin)
#   • Service Usage Consumer      (roles/serviceusage.serviceUsageConsumer)
# (Se faltarem, o deploy falha com erro de permissões — o log diz qual.)
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "O que publicar"
        required: true
        default: "hosting,firestore:rules"
        type: choice
        options:
          - "hosting,firestore:rules"
          - "hosting"
          - "firestore:rules"

concurrency:
  group: studio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Preparar credenciais do Firebase (service account)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT não está definido no repositório."
            exit 1
          fi
          SA_PATH="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_PATH"
          node -e "const j = JSON.parse(require('fs').readFileSync('$SA_PATH', 'utf8')); if (!j.project_id) throw new Error('project_id em falta na service account'); console.log('service account OK — project:', j.project_id, '· conta:', j.client_email);"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_PATH" >> "$GITHUB_ENV"

      - name: Gerar web/trigger-config.js (a partir do secret TRIGGER_TOKEN)
        env:
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          # O trigger-config.js está no .gitignore (não vai no checkout), por isso
          # gera-se aqui a partir do secret. Sem ele, o site publicado ficaria sem
          # o disparo do motor ("Processar agora" diria "não configurado").
          if [ -z "$TRIGGER_TOKEN" ]; then
            echo "::warning::Secret TRIGGER_TOKEN não definido — o site vai sem disparo automático. Define-o em Settings → Secrets → Actions para activar o botão 'Processar agora'."
          else
            {
              echo "// Gerado automaticamente pelo workflow de deploy a partir do secret TRIGGER_TOKEN."
              echo "export const GITHUB_TRIGGER = {"
              echo "  repo: \"${{ github.repository }}\","
              echo "  token: \"${TRIGGER_TOKEN}\""
              echo "};"
            } > web/trigger-config.js
            echo "web/trigger-config.js gerado para ${{ github.repository }}."
          fi

      - name: Deploy
        env:
          # Num push automático não há inputs — publica hosting + regras.
          TARGET: ${{ inputs.target || 'hosting,firestore:rules' }}
        run: |
          echo "A publicar: $TARGET"
          firebase deploy \
            --only "$TARGET" \
            --project pateo-das-laranjeiras \
            --non-interactive \
            --force
